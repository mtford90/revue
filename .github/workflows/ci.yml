name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Release Please routes commits by their touched files, so CI must inspect the actual PR
      # commits rather than actions/checkout's synthetic merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Check release route tip
        run: bun scripts/release-routes.ts check
      - name: Check release routes for every commit
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"
          bun scripts/release-routes.ts check-range "$BASE_SHA" "$HEAD_SHA"
      - run: bun run typecheck
      - run: bun run lint
      # Bun source tests load the checkout addon; without it, auto mode warns on stderr and
      # pollutes CLI assertions that expect a clean process.
      - name: Build native highlighter for tests
        run: bash scripts/build-native-highlighter.sh revue packages/diff/native/target/release/revue_highlighter.node
      # Spawn-heavy CLI tests need more than bun's five-second default.
      - run: bun test --timeout 30000
