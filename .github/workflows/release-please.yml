name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      revue_release_created: ${{ steps.release.outputs['.release-please/revue--release_created'] }}
      revue_tag_name: ${{ steps.release.outputs['.release-please/revue--tag_name'] }}
      revuediff_release_created: ${{ steps.release.outputs['.release-please/revuediff--release_created'] }}
      revuediff_tag_name: ${{ steps.release.outputs['.release-please/revuediff--tag_name'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check release routes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          bun scripts/release-routes.ts check
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
          bun scripts/release-routes.ts check-range "$BASE_SHA" "$HEAD_SHA"
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-revue-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.revue_release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.release-please.outputs.revue_tag_name }}
    secrets: inherit

  build-revuediff-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.revuediff_release_created == 'true' }}
    uses: ./.github/workflows/revuediff-release.yml
    with:
      release_tag: ${{ needs.release-please.outputs.revuediff_tag_name }}
    secrets: inherit
