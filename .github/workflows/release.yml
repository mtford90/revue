name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      matrix:
        # OpenTUI ships per-platform native libraries, so every target builds on its own
        # architecture — cross-compiling would embed the wrong (or no) native code.
        # macos-15-intel is GitHub's last x86_64 macOS image and retires in August 2027.
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # The Intel macOS runner starts processes several times slower than the other
      # platforms; spawn-heavy CLI tests need more than bun's five-second default.
      - run: bun test --timeout 30000
      - name: Stamp the CLI version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' packages/tui/package.json > package.json.tmp
          mv package.json.tmp packages/tui/package.json
      - name: Compile
        run: bun build --compile packages/tui/src/main.tsx --outfile dist/revue
      - name: Smoke-test the executable
        run: bash scripts/release-smoke.sh dist/revue "${GITHUB_REF_NAME#v}"
      - name: Package
        run: |
          staging="dist/revue-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp dist/revue README.md LICENSE "$staging/"
          for pkg in tui diff-renderer theme types; do
            cp "packages/$pkg/THIRD_PARTY_NOTICES.md" "$staging/THIRD_PARTY_NOTICES-$pkg.md"
          done
          cp skills/revue/THIRD_PARTY_NOTICES.md "$staging/THIRD_PARTY_NOTICES-skill.md"
          bun scripts/collect-licenses.ts "$staging/BUNDLED_LICENSES.md"
          tar -czf "$staging.tar.gz" -C "$staging" .
      - uses: actions/upload-artifact@v4
        with:
          name: revue-${{ matrix.target }}
          path: dist/revue-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum *.tar.gz > checksums.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz artifacts/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "revue $GITHUB_REF_NAME" --generate-notes
