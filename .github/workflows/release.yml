name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      matrix:
        # OpenTUI ships per-platform native libraries, so every target builds on its own
        # architecture — cross-compiling would embed the wrong (or no) native code.
        # macos-15-intel is GitHub's last x86_64 macOS image and retires in August 2027.
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify release version
        run: |
          git describe --tags --exact-match HEAD | grep -Fx "$RELEASE_TAG"
          release_version="${RELEASE_TAG#v}"
          test "$(jq -r '.version' package.json)" = "$release_version"
          test "$(jq -r '.version' packages/tui/package.json)" = "$release_version"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # Bun source tests load the checkout addon; without it, auto mode warns on stderr and
      # pollutes CLI assertions that expect a clean process.
      - name: Build native highlighter for tests
        run: bash scripts/build-native-highlighter.sh revue packages/diff/native/target/release/revue_highlighter.node
      # The Intel macOS runner starts processes several times slower than the other
      # platforms; spawn-heavy CLI tests need more than bun's five-second default.
      - run: bun test --timeout 30000
      - name: Compile
        run: |
          bun build --compile packages/tui/src/main.tsx --outfile dist/revue
          bash scripts/build-native-highlighter.sh revue dist/revue-highlighter.node
      - name: Smoke-test the executable
        run: bash scripts/release-smoke.sh dist/revue "${RELEASE_TAG#v}"
      - name: Package
        run: |
          staging="dist/revue-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp dist/revue dist/revue-highlighter.node README.md LICENSE "$staging/"
          bun scripts/copy-local-notices.ts "$staging"
          bun scripts/collect-licenses.ts "$staging/BUNDLED_LICENSES.md"
          bun scripts/collect-rust-licenses.ts >> "$staging/BUNDLED_LICENSES.md"
          tar -czf "$staging.tar.gz" -C "$staging" .
      - uses: actions/upload-artifact@v4
        with:
          name: revue-${{ matrix.target }}
          path: dist/revue-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum *.tar.gz > checksums.txt
      - name: Create a draft release when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "revue $RELEASE_TAG" \
              --draft \
              --generate-notes
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/*.tar.gz artifacts/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/mtford90/homebrew-tap.git" tap
          bash scripts/generate-tap-formula.sh "$version" artifacts/checksums.txt > tap/Formula/revue.rb
          cd tap
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "revue ${version}"
          git push
