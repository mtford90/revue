name: Revuediff performance sample

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Run non-gating compiled benchmark sample
        run: bun run perf:revuediff -- --repetitions 5 --warmups 1 --json artifacts/revuediff-perf.json
      - name: Upload benchmark report, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revuediff-performance-${{ github.run_id }}
          path: artifacts/revuediff-perf.json
          if-no-files-found: error
