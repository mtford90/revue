[package]
name = "revue-highlighter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["cdylib"]

[dependencies]
bat = { version = "0.26.1", default-features = false }
napi = { version = "3.12.0", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "3.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig", "plist-load"] }

[build-dependencies]
napi-build = "2.2.4"
