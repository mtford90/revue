<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>revue</title>
<meta name="description" content="revue — narrative code review in your terminal. Coming soon." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    --stage: #10141c;
    --curtain: #ffb454;
    --ink: #bfbdb6;
    --muted: #77808c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --stage: #fcfcfc;
      --curtain: #a65d00;
      --ink: #5c6166;
      --muted: #828c99;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh;
    display: grid;
    place-content: center;
    gap: 0.75rem;
    padding: 2rem;
    text-align: center;
    background: var(--stage);
    color: var(--ink);
    font-family: system-ui, sans-serif;
  }
  h1 {
    font-family: "Fraunces", serif;
    font-size: clamp(3rem, 14vw, 5.5rem);
    font-weight: 500;
    line-height: 1;
    color: var(--curtain);
  }
  p { color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; }
  a { color: inherit; }
</style>
</head>
<body>
  <h1>revue</h1>
  <p>Coming soon</p>
  <p><a href="https://github.com/mtford90/revue">github.com/mtford90/revue</a></p>
</body>
</html>
